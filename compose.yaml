services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cangzhi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cangzhi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cangzhi-dev}
      POSTGRES_DB: ${POSTGRES_DB:-cangzhi}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cangzhi} -d ${POSTGRES_DB:-cangzhi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cangzhi-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cangzhi}:${POSTGRES_PASSWORD:-cangzhi-dev}@postgres:5432/${POSTGRES_DB:-cangzhi}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cangzhi-api
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - "${STORAGE_HOST_PATH:-./storage}:/app/storage"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cangzhi}:${POSTGRES_PASSWORD:-cangzhi-dev}@postgres:5432/${POSTGRES_DB:-cangzhi}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      STORAGE_PATH: /app/storage
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      DATASET_QUERY_MEMORY_LIMIT: ${DATASET_QUERY_MEMORY_LIMIT:-512MB}
      DATASET_QUERY_THREADS: ${DATASET_QUERY_THREADS:-2}
      DATASET_QUERY_TIMEOUT_SECONDS: ${DATASET_QUERY_TIMEOUT_SECONDS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CANGZHI_SECRET_KEY: ${CANGZHI_SECRET_KEY:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-v1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: cangzhi-worker
    command: ["python", "-m", "apps.worker.main"]
    volumes:
      - "${STORAGE_HOST_PATH:-./storage}:/app/storage"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cangzhi}:${POSTGRES_PASSWORD:-cangzhi-dev}@postgres:5432/${POSTGRES_DB:-cangzhi}
      POLL_INTERVAL: ${POLL_INTERVAL:-5}
      STORAGE_PATH: /app/storage
      DATASET_QUERY_MEMORY_LIMIT: ${DATASET_QUERY_MEMORY_LIMIT:-512MB}
      DATASET_QUERY_THREADS: ${DATASET_QUERY_THREADS:-2}
      AI_PROVIDER: ${AI_PROVIDER:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      URL_FETCH_MAX_BYTES: ${URL_FETCH_MAX_BYTES:-5242880}
      URL_FETCH_TIMEOUT_SECONDS: ${URL_FETCH_TIMEOUT_SECONDS:-20}
      URL_FETCH_MAX_REDIRECTS: ${URL_FETCH_MAX_REDIRECTS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CANGZHI_SECRET_KEY: ${CANGZHI_SECRET_KEY:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-v1}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "apps.worker.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8000
        CANGZHI_WEB_BASE_PATH: ${CANGZHI_WEB_BASE_PATH:-}
    container_name: cangzhi-web
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0"]
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    environment:
      API_URL: http://api:8000
      CANGZHI_WEB_BASE_PATH: ${CANGZHI_WEB_BASE_PATH:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const raw = (process.env.CANGZHI_WEB_BASE_PATH || '').trim(); const p = raw && raw !== '/' ? '/' + raw.replace(/^\\/+|\\/+$/g, '') : ''; require('http').get('http://localhost:3000' + p + '/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
